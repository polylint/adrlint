name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Every job states the permissions it needs. `id-token: write` is granted only to the jobs that
# exchange an OIDC token for a registry credential, never workflow-wide.
permissions:
  contents: read

jobs:
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      # Validate before checkout, builds or any registry call so a malformed or hostile ref cannot
      # reach a later step at all.
      - name: Validate the release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          # A tag name is attacker-controlled input that reaches `gh release create`, so it must be
          # shaped like a release before any of it is used.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to release '$tag': expected v<major>.<minor>.<patch> with an optional -<suffix>."
            exit 1
          fi

          version="${tag#v}"
          python_version="$(echo "$version" | sed 's/-rc\.//g; s/-rc/rc/')"

          {
            echo "version=$version"
            echo "python_version=$python_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo/npm version: $version"
          echo "Python version: $python_version"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Verify version consistency across all surfaces
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHON_VERSION: ${{ steps.version.outputs.python_version }}
        run: |
          set -euo pipefail
          target_version="$VERSION"
          target_python_version="$PYTHON_VERSION"

          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target_version" ]; then
            echo "::error::Cargo.toml version mismatch: expected $target_version, got $cargo_version"
            exit 1
          fi

          npm_version="$(jq -r '.version' npm-package/package.json)"
          if [ "$npm_version" != "$target_version" ]; then
            echo "::error::npm-package/package.json version mismatch: expected $target_version, got $npm_version"
            exit 1
          fi

          # Each platform package and the umbrella's exact pin on it move with the release version.
          for manifest in npm-package/platforms/*/package.json; do
            platform_name="$(jq -r '.name' "$manifest")"
            platform_version="$(jq -r '.version' "$manifest")"
            if [ "$platform_version" != "$target_version" ]; then
              echo "::error::$manifest version mismatch: expected $target_version, got $platform_version"
              exit 1
            fi
            pinned="$(jq -r --arg name "$platform_name" '.optionalDependencies[$name] // empty' npm-package/package.json)"
            if [ "$pinned" != "$target_version" ]; then
              echo "::error::npm-package/package.json pins $platform_name at '$pinned', expected $target_version"
              exit 1
            fi
          done

          pypi_version="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          if [ "$pypi_version" != "$target_python_version" ]; then
            echo "::error::pip-package/pyproject.toml version mismatch: expected $target_python_version, got $pypi_version"
            exit 1
          fi

          init_version="$(grep -E '^__version__ = "' pip-package/adrlint/__init__.py | cut -d'"' -f2)"
          if [ "$init_version" != "$target_python_version" ]; then
            echo "::error::pip-package/adrlint/__init__.py version mismatch: expected $target_python_version, got $init_version"
            exit 1
          fi

          echo "All version surfaces match: $target_version"

      - name: Detect already-published versions
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHON_VERSION: ${{ steps.version.outputs.python_version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          python_version="$PYTHON_VERSION"

          crates_exists=false
          if curl -fsS "https://crates.io/api/v1/crates/adrlint/${version}" >/dev/null; then
            crates_exists=true
          fi

          npm_exists=false
          if npm view "@polylint/adrlint@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/adrlint/${python_version}/json" >/dev/null; then
            pypi_exists=true
          fi

          {
            echo "crates_exists=$crates_exists"
            echo "npm_exists=$npm_exists"
            echo "pypi_exists=$pypi_exists"
          } >> "$GITHUB_OUTPUT"

          echo "Already published?"
          echo "  crates.io: $crates_exists"
          echo "  npm:       $npm_exists"
          echo "  PyPI:      $pypi_exists"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          release_assets_exist=false

          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            release_assets_exist=true
            for asset in adrlint-x86_64-unknown-linux-gnu.tar.gz adrlint-aarch64-unknown-linux-gnu.tar.gz \
              adrlint-x86_64-unknown-linux-musl.tar.gz adrlint-aarch64-unknown-linux-musl.tar.gz \
              adrlint-aarch64-apple-darwin.tar.gz adrlint-x86_64-apple-darwin.tar.gz \
              adrlint-x86_64-pc-windows-msvc.zip adrlint-aarch64-pc-windows-msvc.zip; do
              if ! grep -Fxq "$asset" <<< "$assets"; then
                release_assets_exist=false
              fi
            done
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"

  # Nothing is built or published until the tagged commit passes the same gates CI enforces.
  verify:
    name: Verify the tagged commit
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # ~keep No rust-toolchain.toml; release builds install the Rust 1.99 pinned here.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99"
          components: clippy, rustfmt

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: verify

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Check licenses, bans, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  create_release:
    name: Create GitHub release (draft)
    needs: [meta, verify]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.meta.outputs.release_assets_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

  build-macos:
    name: Build macOS / ${{ matrix.triple }}
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-apple-darwin
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # ~keep No rust-toolchain.toml; release builds install the Rust 1.99 pinned here.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99"
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Build release binary
        env:
          TRIPLE: ${{ matrix.triple }}
        run: cargo build --release --bin adrlint --target "$TRIPLE"

      - name: Package archive
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tar czf "adrlint-${TRIPLE}.tar.gz" -C "target/${TRIPLE}/release" adrlint

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: gh release upload "$TAG" "adrlint-${TRIPLE}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  build-windows:
    name: Build Windows / ${{ matrix.triple }}
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    # rumdl depends on tikv-jemallocator on every target except msvc and wasm; tikv-jemalloc-sys
    # cannot link against the mingw runtime, so the Windows archives are built on Windows with the
    # MSVC toolchain rather than cross-compiled. The arm64 archive is built natively on Windows on
    # Arm, which needs no emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
          - triple: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # ~keep No rust-toolchain.toml; release builds install the Rust 1.99 pinned here.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99"
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --bin adrlint --target $env:TRIPLE

      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target/$env:TRIPLE/release/adrlint.exe"
          if (-not (Test-Path $binary)) {
            throw "$binary was not produced by the build"
          }
          $archive = "adrlint-$env:TRIPLE.zip"
          Compress-Archive -Path $binary -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Upload to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$env:TAG" "adrlint-$env:TRIPLE.zip" --clobber --repo "$env:GITHUB_REPOSITORY"

  build-linux:
    name: Build Linux / ${{ matrix.triple }}
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
            rustup_arch: x86_64
            rustup_init_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
            rustup_arch: aarch64
            rustup_init_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # The manylinux images ship no Rust. Installing rustup by piping a remote script into a shell
      # executes whatever that URL serves; instead the versioned rustup-init binary is fetched and
      # checked against the digest pinned in the matrix before it runs.
      - name: Install Rust (in container)
        env:
          RUSTUP_VERSION: "1.28.2"
          RUSTUP_ARCH: ${{ matrix.rustup_arch }}
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_init_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSLo rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUSTUP_ARCH}-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  rustup-init" | sha256sum -c -
          chmod +x rustup-init
          export CARGO_HOME=/opt/cargo
          export RUSTUP_HOME=/opt/rustup
          ./rustup-init -y --profile minimal --no-modify-path --default-toolchain 1.99
          rm -f rustup-init
          {
            echo "CARGO_HOME=/opt/cargo"
            echo "RUSTUP_HOME=/opt/rustup"
            echo "RUSTUP_TOOLCHAIN=1.99"
          } >> "$GITHUB_ENV"
          echo "/opt/cargo/bin" >> "$GITHUB_PATH"

      - name: Install gh CLI (in container)
        run: |
          set -euo pipefail
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - name: Build release binary
        env:
          TRIPLE: ${{ matrix.triple }}
        run: cargo build --release --bin adrlint --target "$TRIPLE"

      - name: Package archive
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tar czf "adrlint-${TRIPLE}.tar.gz" -C "target/${TRIPLE}/release" adrlint

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-/__w/adrlint/adrlint}"
          gh release upload "$TAG" "adrlint-${TRIPLE}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  build-linux-musl:
    name: Build Linux musl / ${{ matrix.triple }}
    needs: [meta, verify, create_release]
    if: needs.verify.result == 'success' && needs.create_release.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - triple: aarch64-unknown-linux-musl
            # cross runs the aarch64-musl build in its own container. Keep the job on an x86_64
            # runner: cross 0.2.5 bootstraps the x86_64 toolchain and fails to install on an
            # aarch64 host ("toolchain may not be able to run on this system").
            os: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # ~keep No rust-toolchain.toml; release builds install the Rust 1.99 pinned here.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99"
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      # cross builds inside a container that carries the musl toolchain, so the Rust static target
      # and `tikv-jemalloc-sys` (which rumdl links on musl too) build without a feature override.
      - name: Install cross
        env:
          CROSS_VERSION: "0.2.5"
        run: cargo install cross --locked --version "$CROSS_VERSION"

      - name: Build release binary
        env:
          TRIPLE: ${{ matrix.triple }}
        run: cross build --release --bin adrlint --target "$TRIPLE"

      - name: Package archive
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tar czf "adrlint-${TRIPLE}.tar.gz" -C "target/${TRIPLE}/release" adrlint

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: gh release upload "$TAG" "adrlint-${TRIPLE}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    name: Generate and upload checksums
    needs: [meta, build-macos, build-windows, build-linux, build-linux-musl]
    if: needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-linux-musl.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify all 8 archives are present, then generate checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="$VERSION"

          expected=(
            "adrlint-x86_64-unknown-linux-gnu.tar.gz"
            "adrlint-aarch64-unknown-linux-gnu.tar.gz"
            "adrlint-x86_64-unknown-linux-musl.tar.gz"
            "adrlint-aarch64-unknown-linux-musl.tar.gz"
            "adrlint-aarch64-apple-darwin.tar.gz"
            "adrlint-x86_64-apple-darwin.tar.gz"
            "adrlint-x86_64-pc-windows-msvc.zip"
            "adrlint-aarch64-pc-windows-msvc.zip"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > /tmp/assets.txt || true
          missing=0
          for asset in "${expected[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::Missing expected archive: $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Release incomplete: $missing of 8 archives missing."
            exit 1
          fi
          echo "All 8 archives present"

          for asset in "${expected[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$asset" -O "$asset"
          done
          sha256sum adrlint-*.tar.gz adrlint-*.zip | sort > "adrlint_${version}_checksums.txt"
          cat "adrlint_${version}_checksums.txt"
          gh release upload "$tag" "adrlint_${version}_checksums.txt" --clobber --repo "$GITHUB_REPOSITORY"

  finalize_release:
    name: Publish GitHub release
    needs: [meta, verify, checksums]
    # `checksums` is skipped only when `meta` found every archive already on the release (a re-run),
    # and this job verifies all nine assets itself before promoting, so a skip is not trusted blindly.
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && (needs.checksums.result == 'success' || needs.checksums.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft to published once complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="$VERSION"

          required=(
            "adrlint-x86_64-unknown-linux-gnu.tar.gz"
            "adrlint-aarch64-unknown-linux-gnu.tar.gz"
            "adrlint-x86_64-unknown-linux-musl.tar.gz"
            "adrlint-aarch64-unknown-linux-musl.tar.gz"
            "adrlint-aarch64-apple-darwin.tar.gz"
            "adrlint-x86_64-apple-darwin.tar.gz"
            "adrlint-x86_64-pc-windows-msvc.zip"
            "adrlint-aarch64-pc-windows-msvc.zip"
            "adrlint_${version}_checksums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "Promoted $tag to a published release"

  float_major_tag:
    name: Float the major tag
    needs: [meta, verify, finalize_release]
    if: needs.verify.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    # Repository tag rules can reject a ref update made with the workflow token. The release and
    # every package are already published at this point, so a protected tag must not fail the run;
    # move it manually instead.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Move the major tag onto this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          major="${tag%%.*}"

          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
              -F sha="$sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${major}" -f sha="$sha" >/dev/null
          fi
          echo "${major} now points at ${tag} (${sha})"

  verify-binstall:
    name: Verify cargo-binstall install
    needs: [meta, verify, finalize_release]
    if: needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.release_assets_exist != 'true'
    permissions:
      contents: read
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: adrlint
      binary-name: adrlint
      manifest-path: .
      checkout-ref: ${{ needs.meta.outputs.tag }}
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "macos-26", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      smoke-command: |
        adrlint --version

  publish_crates:
    name: Publish crates.io
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.crates_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates-io-auth-action exchanges this for a scoped registry token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # ~keep No rust-toolchain.toml; release builds install the Rust 1.99 pinned here.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99"

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates_auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail
          if cargo publish 2>cargo-publish.err; then
            exit 0
          fi

          if grep -Eq "crate .* already exists" cargo-publish.err; then
            echo "crate already published; skipping"
            exit 0
          fi

          cat cargo-publish.err >&2
          exit 1

  publish_npm:
    name: Publish npm
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.npm_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `npm publish --provenance` exchanges the workflow's OIDC identity for a short-lived
      # npm token (trusted publishing); without this the upload is rejected.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # The tag checkout may predate mise.toml; restore it from the workflow commit. ~keep
      - name: Setup Node.js
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node
          config-ref: ${{ github.sha }}

      # The platform packages ship the archives attached to the release, byte for byte; a rebuild
      # here would publish binaries the release checksums do not describe.
      - name: Download the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts --clobber \
            --pattern 'adrlint-*.tar.gz' --pattern 'adrlint-*.zip' \
            --pattern "adrlint_${VERSION}_checksums.txt"
          ls -l artifacts

      # stage-binaries.sh verifies every archive against the checksum manifest before unpacking it.
      - name: Stage the release binaries into the platform packages
        run: ./npm-package/stage-binaries.sh --artifacts artifacts

      - name: Publish to npm
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          version="$VERSION"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          publish_one() {
            local dir="$1" name
            name="$(jq -r '.name' "$dir/package.json")"
            # A re-run after a partial failure skips what already landed; npm never accepts the
            # same version twice.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              return 0
            fi
            echo "publishing ${name}@${version} (--tag ${npm_tag})"
            (cd "$dir" && npm publish --provenance --access public --tag "$npm_tag")
          }

          # Platform packages first; `set -e` aborts before the umbrella if any fails, so the
          # umbrella never reaches the registry pinning a platform package that does not exist.
          platforms=(npm-package/platforms/*/)
          expected="$(jq -er '.optionalDependencies | length | select(. > 0)' npm-package/package.json)"
          if [ "${#platforms[@]}" -ne "$expected" ]; then
            echo "::error::${#platforms[@]} platform packages on disk, $expected pinned by the umbrella"
            exit 1
          fi
          for dir in "${platforms[@]}"; do
            publish_one "${dir%/}"
          done
          publish_one npm-package

  publish_pypi:
    name: Publish PyPI
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && needs.meta.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: gh-action-pypi-publish mints the upload token over OIDC.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # The tag checkout may predate mise.toml; restore it from the workflow commit. ~keep
      - name: Setup Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: python
          config-ref: ${{ github.sha }}

      - name: Download the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts --clobber \
            --pattern 'adrlint-*.tar.gz' --pattern 'adrlint-*.zip' \
            --pattern "adrlint_${VERSION}_checksums.txt"
          ls -l artifacts

      # One wheel per release target with the binary embedded, plus the py3-none-any fallback wheel
      # that downloads the binary at first run on hosts no platform wheel covers. build_wheels.py
      # verifies every archive against the checksum manifest before unpacking it. No sdist.
      - name: Build the wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build hatchling
          python pip-package/build_wheels.py --artifacts artifacts --out pip-package/dist
          count="$(find pip-package/dist -name '*.whl' | wc -l)"
          if [ "$count" -ne 9 ]; then
            echo "::error::expected 9 wheels (8 platform + 1 fallback), built $count"
            exit 1
          fi
          ls -l pip-package/dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  # Homebrew and Scoop follow the org pattern: a template under scripts/publish/ is rendered by the
  # shared xberg-io/actions renderers, and the org GitHub App (BOT_APP_ID / BOT_APP_PRIVATE_KEY)
  # mints a token scoped to the one tap or bucket repository it pushes to. These jobs check out the
  # workflow revision, not the tag: they only need the templates, and older tags may predate them.
  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint a tap token
        uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: homebrew-tap

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the tap
        uses: actions/checkout@v7
        with:
          repository: polylint/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Render the formula
        uses: xberg-io/actions/publish-homebrew-source-formulas@v1
        with:
          tap-dir: ${{ github.workspace }}/homebrew-tap
          config-file: scripts/publish/homebrew.json
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          github-repo: ${{ github.repository }}

      - name: Commit and push to the tap
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          git add Formula/adrlint.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "adrlint ${VERSION}"
          # Every polylint release pipeline pushes to this one tap, so a concurrent release can land
          # between our checkout and our push. Each repo touches only its own formula, so rebasing
          # onto the new tip and retrying is safe. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  homebrew_bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    needs: [meta, verify, publish_homebrew]
    if: needs.verify.result == 'success' && needs.publish_homebrew.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      # The bottle tarball is uploaded to this repository's release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, bottle_tag: arm64_tahoe, install_brew: false }
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@v1

      - name: Build the bottle
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          tap: polylint/tap
          formulas: adrlint
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: ${{ github.repository }}

      - name: Upload the bottle manifest
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish_homebrew_bottles:
    name: Merge Homebrew bottle DSL
    needs: [meta, verify, publish_homebrew, homebrew_bottles]
    if: needs.verify.result == 'success' && needs.publish_homebrew.result == 'success' && needs.homebrew_bottles.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint a tap token
        uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: homebrew-tap

      - name: Checkout the tap
        uses: actions/checkout@v7
        with:
          repository: polylint/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Download the bottle manifests
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - name: Merge the bottle DSL
        uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: adrlint
          github-repo: ${{ github.repository }}

      - name: Commit and push the bottle DSL
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          git add Formula/adrlint.rb
          if git diff --cached --quiet; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git commit -m "adrlint ${VERSION}: add bottle DSL"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  publish_scoop:
    name: Update Scoop manifest
    needs: [meta, verify, finalize_release]
    if: needs.meta.result == 'success' && needs.verify.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint a bucket token
        uses: actions/create-github-app-token@v3
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: scoop-bucket

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the bucket
        uses: actions/checkout@v7
        with:
          repository: polylint/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - name: Render the manifest
        uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          github-repo: ${{ github.repository }}

      - name: Commit and push to the bucket
        working-directory: scoop-bucket
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          git add bucket/adrlint.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already up to date."
            exit 0
          fi
          git commit -m "adrlint ${VERSION}"
          # Every polylint release pipeline pushes to this one bucket; rebase and retry on a race. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1
