[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adrlint"
version = "0.5.2"
description = "A fast, opinionated linter and formatter for MADR architecture decision records"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Na'aman Hirschfeld", email = "nhirschfeld@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
    "Environment :: Console"
]
keywords = ["adr", "architecture-decision-record", "madr", "linter", "markdown", "cli", "rust"]
requires-python = ">=3.11"
# Platform wheels carry the binary and need nothing. The py3-none-any fallback wheel downloads the
# release binary at first run and adds certifi for that (see hatch_build.py).
dependencies = []

[project.urls]
Homepage = "https://github.com/polylint/adrlint"
Repository = "https://github.com/polylint/adrlint.git"
Issues = "https://github.com/polylint/adrlint/issues"

[project.scripts]
adrlint = "adrlint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["adrlint"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# No sdist: the distribution's payload is a prebuilt binary a source build cannot reproduce.
[tool.hatch.build.targets.sdist]
exclude = ["*"]
